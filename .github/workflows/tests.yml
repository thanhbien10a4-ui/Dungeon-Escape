name: tests
on:
  push:
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "server[dev]"
      - run: pytest server/tests
      - run: python -m compileall -q server/app training
      - run: node --check web/app.js
